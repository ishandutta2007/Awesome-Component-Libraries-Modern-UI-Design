<svg fill="none" viewBox="0 0 1200 420" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .pulsing-orb {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .anim-dash {
        stroke-dasharray: 6 6;
        animation: dashAnim 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="220" cy="140" r="240" fill="url(#glowCyan)" class="pulsing-orb" />
  <circle cx="980" cy="280" r="260" fill="url(#glowPurple)" class="pulsing-orb" />

  <!-- Animated Background Design Elements (Behind Foreground Text) -->
  <g opacity="0.3" class="anim-dash">
    <path d="M 100 80 Q 600 -40 1100 80" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <path d="M 100 340 Q 600 460 1100 340" stroke="#818cf8" stroke-width="1.5" fill="none" />
  </g>

  <!-- Background Floating Component Mockup 1 (Left) -->
  <g class="floating-card-1" opacity="0.45" transform="translate(60, 160)">
    <rect width="180" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="15" y="15" width="50" height="10" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="15" y="35" width="150" height="6" rx="2" fill="#475569" />
    <rect x="15" y="47" width="110" height="6" rx="2" fill="#334155" />
    <rect x="15" y="70" width="70" height="24" rx="6" fill="#0284c7" />
    <rect x="95" y="70" width="70" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  </g>

  <!-- Background Floating Component Mockup 2 (Right) -->
  <g class="floating-card-2" opacity="0.45" transform="translate(960, 150)">
    <rect width="180" height="120" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="30" cy="25" r="10" fill="#a855f7" />
    <rect x="50" y="20" width="90" height="10" rx="3" fill="#cbd5e1" opacity="0.7" />
    <rect x="15" y="48" width="150" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="15" y="75" width="150" height="32" rx="4" fill="#581c87" opacity="0.4" stroke="#7e22ce" stroke-width="1" />
  </g>

  <!-- Outer Frame Highlight -->
  <rect x="1" y="1" width="1198" height="418" rx="15" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, clean typography, uninterrupted -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Category Badge Pill -->
    <rect x="-170" y="0" width="340" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Component Libraries</text>
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.2">&amp; Modern UI Design</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="174" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Production-Ready UI Primitives • Copy-Paste Registries • Accessible Design Systems • Tailwind CSS Kits
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#38bdf8" />
        <text x="28" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">React &amp; Next.js</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#06b6d4" />
        <text x="28" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Tailwind CSS v4</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#818cf8" />
        <text x="28" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Copy-Paste / CLI</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#c084fc" />
        <text x="28" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">WAI-ARIA A11y</text>
      </g>
    </g>
  </g>
</svg>
